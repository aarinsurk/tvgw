#!/usr/sbin/nft -f
add table ip tvgw
delete table ip tvgw
table ip tvgw {
  chain forward {
    type filter hook forward priority filter; policy accept;
    ip saddr 192.168.31.217 udp dport 443 reject
  }
  chain postrouting {
    type nat hook postrouting priority srcnat; policy accept;
    ip saddr 192.168.31.217 oifname "eth0" masquerade
  }
}
